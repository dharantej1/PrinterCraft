[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-craft"
dynamic = ["version"]
description = "Universal document printing library and CLI for macOS, Unix and Windows, reverse-engineered from PdfCraft.app"
readme = "README.md"
authors = [
    { name = "Open Source Community" }
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["cups", "printing", "printer", "pdf", "macos", "reverse-engineering", "lp", "lpoptions", "windows", "win32print"]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["printer_craft*"]

[tool.setuptools_scm]
version_file = "printer_craft/_version.py"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "build>=1.0.3",
    "twine>=4.0.2",
    "wheel>=0.42.0",
]
extras = [
    "pypdf>=3.17.0",
    "Pillow>=10.2.0",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "pypdf>=3.17.0; sys_platform == 'win32'",
    "Pillow>=10.2.0; sys_platform == 'win32'",
]

[project.scripts]
printer-craft = "printer_craft.cli:main"
printcraft = "printer_craft.cli:main"

[project.urls]
Homepage = "https://github.com/dharantej1/PrinterCraft"
Repository = "https://github.com/dharantej1/PrinterCraft"
Issues = "https://github.com/dharantej1/PrinterCraft/issues"
