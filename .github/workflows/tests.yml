name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CUPS client (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cups-client
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pypdf Pillow pypdfium2
      - name: Run test suite
        run: python -m unittest discover tests -v

  windows:
    name: windows-latest / Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install printer-craft[windows]
        run: python -m pip install --upgrade pip ".[windows]"
      - name: Run platform-independent and Windows backend tests
        run: python -m unittest tests.test_models tests.test_backends tests.test_win32_backend tests.test_win32_render -v
      - name: Add a print-to-file test printer
        shell: pwsh
        run: |
          Get-PrinterDriver | Format-Table -AutoSize Name
          $out = Join-Path $env:RUNNER_TEMP "printer_craft_out.bin"
          Add-PrinterPort -Name $out
          Add-Printer -Name "PrinterCraftTest" -DriverName "Microsoft Print To PDF" -PortName $out
          "PRINTER_CRAFT_OUTPUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real Windows spooler smoke test
        run: python .github/scripts/windows_smoke.py
